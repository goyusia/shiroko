name: test

on:
  push:
    branches:
      - master
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "29"
          gleam-version: "1.18.1"
          rebar3-version: "3"
          # elixir-version: "1"
      - run: |
          (cd stdx && gleam deps download)
          (cd protocol && gleam deps download)
          (cd shiroko && gleam deps download)
      - run: make format-check check
      - run: make test
